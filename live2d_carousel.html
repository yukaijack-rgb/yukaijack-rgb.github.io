<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品輪播</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:    #1c1917;
  --muted:  #44403c;
  --line:   rgba(28,25,23,0.1);
  --radius: 12px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #ffffff;
  color: var(--ink);
  min-height: 100vh;
  padding: 1.5rem;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
}

/* ── Header ── */
.header {
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
}

.header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.02em;
}

/* ── Carousel ── */
.carousel-wrap {
  position: relative;
}

/* 主視窗 */
.carousel-main {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1rem;
  position: relative;
}

.carousel-main iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

.carousel-main .placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.3);
  font-size: 14px;
  font-weight: 300;
}

/* ── 左右箭頭 ── */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.92);
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: background 0.12s, opacity 0.12s;
  font-family: inherit;
}

.arrow:hover { background: #fff; }
.arrow.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
.arrow-left  { left: -18px; }
.arrow-right { right: -18px; }

/* ── 縮圖列 ── */
.thumbs-outer {
  overflow: hidden;
  position: relative;
}

.thumbs-track {
  display: flex;
  gap: 10px;
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
}

.thumb {
  flex-shrink: 0;
  width: calc((100% - 30px) / 4);  /* 4 個一排 */
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  border: 2px solid transparent;
  transition: border-color 0.15s, opacity 0.15s;
  background: #000;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.15s;
}

.thumb:hover { opacity: 0.85; }
.thumb.active { border-color: var(--ink); }

/* 縮圖播放圖示 */
.thumb-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
}

.thumb:hover .thumb-play { opacity: 1; }

.thumb-play svg {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
}

/* ── 計數器 ── */
.counter {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
  font-weight: 300;
}

/* ── Loading ── */
.loading-msg {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  padding: 3rem 0;
  font-weight: 300;
}

@media (max-width: 600px) {
  .arrow-left  { left: 4px; }
  .arrow-right { right: 4px; }
  .thumb { width: calc((100% - 20px) / 3); }
}

@media (max-width: 420px) {
  .thumb { width: calc((100% - 10px) / 2); }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="carousel-container">
    <div class="loading-msg">載入中…</div>
  </div>
</div>

<script>
// ── Google Sheets CSV 連結（請替換成您的連結）──────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMX1kwARqorZfyQB3QgeNezFNX_kmd6WAuRVzBcvoSQ_ciu7JlLQ9hKXAwiNWwQYCb6sDjsFEQe00V/pub?gid=0&single=true&output=csv';

// ── 示範資料（串接試算表後會被取代）─────────────────
const DEMO_VIDEOS = [
  { id: 'dQw4w9WgXcQ' },
  { id: 'dQw4w9WgXcQ' },
  { id: 'dQw4w9WgXcQ' },
  { id: 'dQw4w9WgXcQ' },
  { id: 'dQw4w9WgXcQ' },
];

// ── 狀態 ─────────────────────────────────────────────
let VIDEOS = [];
let currentIdx = 0;
const THUMB_VISIBLE = 4; // 縮圖列一次顯示幾個

// ── YouTube 縮圖 URL ──────────────────────────────────
function thumbUrl(id) {
  return `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
}

// ── 渲染 ─────────────────────────────────────────────
function buildCarousel() {
  if (VIDEOS.length === 0) {
    document.getElementById('carousel-container').innerHTML =
      '<div class="loading-msg">目前沒有影片資料</div>';
    return;
  }

  const container = document.getElementById('carousel-container');
  container.innerHTML = `
    <div class="carousel-wrap">
      <div class="carousel-main" id="main-player">
        <div class="placeholder">選擇下方縮圖播放</div>
      </div>
      <button class="arrow arrow-left"  id="arrow-left"  onclick="shiftThumbs(-1)">&#8249;</button>
      <button class="arrow arrow-right" id="arrow-right" onclick="shiftThumbs(1)">&#8250;</button>
      <div class="thumbs-outer" id="thumbs-outer">
        <div class="thumbs-track" id="thumbs-track">
          ${VIDEOS.map((v, i) => `
            <div class="thumb${i === 0 ? ' active' : ''}" id="thumb-${i}" onclick="selectVideo(${i})">
              <img src="${thumbUrl(v.id)}" alt="影片 ${i+1}" loading="lazy">
              <div class="thumb-play">
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="18" cy="18" r="18" fill="rgba(0,0,0,0.5)"/>
                  <polygon points="14,11 27,18 14,25" fill="white"/>
                </svg>
              </div>
            </div>`).join('')}
        </div>
      </div>
      <div class="counter" id="counter">1 / ${VIDEOS.length}</div>
    </div>`;

  selectVideo(0);
  updateArrows();
}

function selectVideo(idx) {
  currentIdx = idx;

  // 更新主播放器
  const player = document.getElementById('main-player');
  player.innerHTML = `<iframe
    src="https://www.youtube.com/embed/${VIDEOS[idx].id}?autoplay=1&rel=0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>`;

  // 更新縮圖 active 狀態
  document.querySelectorAll('.thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });

  // 更新計數器
  document.getElementById('counter').textContent = `${idx + 1} / ${VIDEOS.length}`;

  // 確保選中的縮圖在可視範圍內
  scrollToThumb(idx);
}

// ── 縮圖列滾動 ───────────────────────────────────────
let thumbOffset = 0;

function getThumbWidth() {
  const track = document.getElementById('thumbs-track');
  if (!track) return 0;
  const thumb = track.querySelector('.thumb');
  if (!thumb) return 0;
  return thumb.offsetWidth + 10; // width + gap
}

function shiftThumbs(dir) {
  const maxOffset = Math.max(0, VIDEOS.length - THUMB_VISIBLE);
  thumbOffset = Math.min(maxOffset, Math.max(0, thumbOffset + dir));
  const track = document.getElementById('thumbs-track');
  track.style.transform = `translateX(-${thumbOffset * getThumbWidth()}px)`;
  updateArrows();
}

function scrollToThumb(idx) {
  const maxOffset = Math.max(0, VIDEOS.length - THUMB_VISIBLE);
  if (idx >= thumbOffset + THUMB_VISIBLE) {
    thumbOffset = Math.min(maxOffset, idx - THUMB_VISIBLE + 1);
  } else if (idx < thumbOffset) {
    thumbOffset = idx;
  }
  const track = document.getElementById('thumbs-track');
  if (track) track.style.transform = `translateX(-${thumbOffset * getThumbWidth()}px)`;
  updateArrows();
}

function updateArrows() {
  const maxOffset = Math.max(0, VIDEOS.length - THUMB_VISIBLE);
  const left  = document.getElementById('arrow-left');
  const right = document.getElementById('arrow-right');
  if (!left || !right) return;
  left.classList.toggle('disabled',  thumbOffset <= 0);
  right.classList.toggle('disabled', thumbOffset >= maxOffset);
}

// ── CSV 解析 ─────────────────────────────────────────
function splitCSVLine(line) {
  const cols = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { cols.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());

  // 找 header 列（含 'video_id'）
  let headerIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.some(c => c.trim().toLowerCase() === 'video_id')) {
      headerIdx = i;
      break;
    }
  }
  if (headerIdx === -1) return [];

  const headers = splitCSVLine(lines[headerIdx]).map(h => h.trim().toLowerCase());
  const get = (cols, key) => (cols[headers.indexOf(key)] || '').trim();

  return lines.slice(headerIdx + 1)
    .map(line => {
      const cols = splitCSVLine(line);
      const id = get(cols, 'video_id');
      if (!id) return null;
      return { id };
    })
    .filter(Boolean);
}

// ── 載入 ─────────────────────────────────────────────
async function loadAndRender() {
  if (CSV_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL_HERE') {
    // 尚未設定試算表，使用示範資料
    VIDEOS = DEMO_VIDEOS;
    buildCarousel();
    return;
  }
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    VIDEOS = parseCSV(text);
    buildCarousel();
  } catch (e) {
    document.getElementById('carousel-container').innerHTML =
      '<div class="loading-msg">資料載入失敗，請稍後再試。</div>';
    console.error(e);
  }
}

loadAndRender();
</script>
</body>
</html>
